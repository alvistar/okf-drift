name: release

# Tag-driven, and gated on the tag agreeing with the source of truth. Without this gate
# "VERSION is the single source of truth" is only a convention: tagging v0.5.0 on a
# VERSION=0.4.0 commit would publish a release whose plugin reports a different version
# than its tag. Fail the workflow instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: tag == VERSION == plugin.json version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(tr -d '[:space:]' < VERSION)
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "tag=$tag  VERSION=$version  plugin.json=$plugin"
          fail=0
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with VERSION ($version)"; fail=1
          fi
          if [ "$tag" != "$plugin" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with .claude-plugin/plugin.json ($plugin)"; fail=1
          fi
          exit $fail

      - name: release notes from CHANGELOG.md
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section with content"
            exit 1
          fi
          cat release-notes.md

      # The content pin a consumer repo's .okf-drift-version is written from. A tag can be
      # moved; a sha256 cannot. Basenames, `sha256sum` output format, so the asset can be
      # concatenated under the tag line and read back by `shasum -c`.
      - name: SHA256SUMS over the scripts at this tag
        run: |
          set -eu
          ( cd scripts && sha256sum *.sh *.py ) > SHA256SUMS
          [ -s SHA256SUMS ] || { echo "::error::SHA256SUMS came out empty"; exit 1; }
          grep -q '^[0-9a-f]\{64\}  okf-check\.sh$' SHA256SUMS \
            || { echo "::error::SHA256SUMS has no okf-check.sh line"; exit 1; }
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md SHA256SUMS
