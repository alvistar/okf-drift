name: ci

# Syntax, the version agreement the release workflow will also enforce, and one smoke
# test that exercises the two things a broken commit here would break in every consumer
# repo at once: the scaffold must validate clean, and the gate must FAIL on it — a gate
# that passes a fresh scaffold is a gate that checks nothing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # integration tests verify official historical source tags

      - name: shell syntax
        run: |
          set -eu
          for f in scripts/*.sh; do echo "sh -n $f"; sh -n "$f"; done

      - name: python syntax
        run: python3 -m py_compile scripts/*.py

      - name: gate and recall fail closed at runtime
        run: python3 scripts/okf-runtime-selftest.py

      - name: every YAML parses
        run: |
          set -eu
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, yaml
          # os.walk, not glob('**') — glob skips dotted directories, so .github/workflows
          # would have been excluded from the check that exists to cover it.
          files = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              files += [os.path.join(root, n) for n in names if n.endswith(('.yml', '.yaml'))]
          files.sort()
          assert len(files) >= 3, f"expected the two workflows and the template, found {files}"
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("ok", f)
          PY

      - name: wrapper-free launcher, standalone CI and integration conversion
        run: python3 scripts/okf-launcher-selftest.py

      - name: gate and recall through the pinned root-aware launcher
        run: OKF_SELFTEST_PINNED=1 python3 scripts/okf-runtime-selftest.py

      - name: VERSION == plugin.json version
        run: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "VERSION=$version  plugin.json=$plugin"
          [ "$version" = "$plugin" ] || { echo "::error::VERSION and .claude-plugin/plugin.json disagree"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The same pinned okf the CI template hands to a consumer repo.
      - name: okf v0.6.0, pinned
        run: |
          go install github.com/okf-memory/okf-agent-memory/cmd/okf@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: okf version

      # The stubbed selftests prove the scripts' own logic; they cannot prove that the
      # REAL okf still emits what those stubs pretend. This drives one scratch repo through
      # the loop with the pinned okf: recall's two signals, a deprecated concept with an
      # expired review date, the change hint after a commit under a concept's code_refs
      # (the gate stays green: a hint is not a failure), and a leftover drift.lock failing
      # the gate with the name of /okf-migrate.
      - name: recall's signals and change hint, and the gate, through the real okf
        run: |
          set -eu
          W="${GITHUB_WORKSPACE:-$PWD}"
          repo=$(mktemp -d)
          cd "$repo"
          git init -q . && git config user.email t@example.com && git config user.name Test

          mkdir -p src knowledge/architecture knowledge/playbooks knowledge/project
          cat > src/lib.rs <<'RS'
          pub fn admit_reusable(x: u32) -> u32 {
              x + 1
          }
          RS

          cat > knowledge/index.md <<'MD'
          ---
          okf_version: "0.2"
          ---
          # Index

          - [Architecture](/architecture/index.md) — Architecture concepts.
          - [Playbooks](/playbooks/index.md) — Playbook concepts.
          - [Project](/project/index.md) — Project concepts.
          MD
          printf '# Log\n\n- 2026-09-19 — scratch bundle, written by this CI step.\n' > knowledge/log.md
          sh "$W/scripts/okf-log.sh" split knowledge   # the frozen log, as /okf-migrate leaves it

          cat > knowledge/architecture/index.md <<'MD'
          # Architecture

          - [Core](/architecture/core.md) — The admission path and the ceiling it enforces.
          MD
          cat > knowledge/architecture/core.md <<'MD'
          ---
          type: Reference
          title: Core
          description: The admission path and the ceiling it enforces.
          last_updated: 2026-09-19
          stale_after: 2099-01-01
          code_refs:
            - src/lib.rs
          ---
          # Core

          Admission enforces a ceiling: look in `src/lib.rs` for where.

          ## Related

          - [Superseded way](/playbooks/superseded-way.md)
          MD

          cat > knowledge/playbooks/index.md <<'MD'
          # Playbooks

          - [Superseded way](/playbooks/superseded-way.md) — How admission used to be checked, kept for history.
          MD
          cat > knowledge/playbooks/superseded-way.md <<'MD'
          ---
          type: Playbook
          title: Superseded way
          description: How admission used to be checked, kept for history.
          status: deprecated
          last_updated: 2026-01-01
          stale_after: 2026-02-01
          code_refs: []
          ---
          # Superseded way

          Superseded by [Core](/architecture/core.md).

          ## Related

          - [Core](/architecture/core.md)
          MD

          cat > knowledge/project/index.md <<'MD'
          # Project

          - [State](/project/state.md) — What is working, what is not yet built, what is broken.
          MD
          cat > knowledge/project/state.md <<'MD'
          ---
          type: Reference
          title: State
          description: What is working, what is not yet built, what is broken.
          last_updated: 2026-09-19
          code_refs: []
          ---
          # State

          **Working:**
          - The scratch bundle.

          **Not yet built:**
          - Nothing.

          **Known issues:**
          - None.

          ## Related

          - [Core](/architecture/core.md)
          MD

          git add -A && git commit -qm "scratch bundle"

          say() { printf '\n== %s ==\n' "$1"; }
          fail() { echo "::error::$1"; exit 1; }
          has() { printf '%s\n' "$2" | grep -qF "$1"; }

          say "recall on an untouched tree prints status and review, and no change hint"
          out=$(sh "$W/scripts/okf-recall.sh" "admission ceiling" knowledge)
          printf '%s\n' "$out"
          has 'no status · review current' "$out" || fail "signals missing for the core concept"
          has 'deprecated · review expired 2026-02-01' "$out" \
            || fail "signals missing for the deprecated, expired concept"
          if has 'code changed since' "$out"; then fail "a change hint on code nobody moved"; fi

          # `okf validate --stale` treats an expired `stale_after` as a finding, and this gate treats
          # okf's warnings as fatal — so the same bundle cannot both demonstrate `review expired` and
          # be green. Move the date forward now that recall has been asserted against it.
          say "bump the expired review date so the gate can be green"
          perl -pi -e 's/^stale_after: 2026-02-01$/stale_after: 2099-02-01/' knowledge/playbooks/superseded-way.md
          git commit -qam "review the superseded way"

          say "the gate is green"
          gate=$(sh "$W/scripts/okf-check.sh" knowledge) || { printf '%s\n' "$gate"; fail "the gate was not green on an untouched bundle"; }
          printf '%s\n' "$gate"
          has 'ok    knowledge:' "$gate" || fail "the gate printed no ok line"
          has '1 concept(s) with empty code_refs (okf search --for-path cannot find them): playbooks/superseded-way.md' "$gate" \
            || fail "the discoverability warning is missing or names the wrong concepts"
          if has 'project/state.md' "$gate"; then fail "the state snapshot is exempt from the code_refs list"; fi

          say "commit under the concept's code_refs: recall shows a change hint, the gate stays green"
          perl -pi -e 's/x \+ 1/x + 2/' src/lib.rs
          git commit -qam "raise the ceiling"
          out=$(sh "$W/scripts/okf-recall.sh" "admission ceiling" knowledge)
          printf '%s\n' "$out"
          has 'code changed since this concept: 1 commit(s) on src/lib.rs' "$out" || fail "no change hint after a commit under code_refs"
          has '"raise the ceiling"' "$out" || fail "the hint does not name the last commit"
          has 'the code wins' "$out" || fail "the read-repair note did not print"
          sh "$W/scripts/okf-check.sh" knowledge >/dev/null || fail "a change hint turned the gate red"

          say "a leftover drift.lock fails the gate, naming /okf-migrate"
          printf 'version = 1\n' > drift.lock
          gate=$(sh "$W/scripts/okf-check.sh" knowledge) && fail "the gate passed with a drift.lock"
          has 'drift.lock found: drift is no longer used, run /okf-migrate' "$gate" || { printf '%s\n' "$gate"; fail "the drift.lock failure does not name /okf-migrate"; }

          echo
          echo "ok — the real okf agrees with the stubbed selftests"

      # Four content-pin properties, against a real tag so the fetch is real. (a) and (b)
      # FAIL against the 0.5.1 shim, which validated a download only by "first line starts
      # with #!": two lines of a 221-line script were accepted, cached forever, and the
      # gate then exited 0 having checked nothing.
      - name: the shim pins by content — selftest against a real tag
        run: scripts/okf-shim-selftest.sh v0.5.1

      # The offline launcher suite above checks explicit development override, failed
      # downloads, pin generation and actual consumer CI bootstrap with fixture releases.
      # This does not depend on publishing the very version being tested.

      - name: scaffold validates clean, and the gate fails it
        run: |
          set -eu
          smoke=$(mktemp -d)
          scripts/okf-scaffold.sh --name "Smoke" "$smoke"
          if out=$(cd "$smoke" && "$GITHUB_WORKSPACE/scripts/okf-check.sh" knowledge 2>&1); then
            echo "::error::the gate passed a fresh scaffold; it must fail on the annotations and placeholders"
            exit 1
          fi
          echo "$out"
          # The scaffold starts split: the frozen log and the setup entry draw no finding.
          case "$out" in
            *"FAIL  log"*|*"FAIL  knowledge/log/"*|*"/okf-migrate"*) echo "::error::the gate failed the scaffold's log, not only its population"; exit 1 ;;
          esac
          echo "ok — scaffold validates clean and the gate fails it, as it must until population"

      - name: wiki scaffold validates clean, the gate fails it empty and passes it populated
        run: |
          set -eu
          wiki=$(mktemp -d)
          scripts/okf-scaffold.sh --profile wiki --name "Wiki" "$wiki"
          [ "$(cat "$wiki/.okf-profile")" = wiki ] || { echo "::error::scaffold did not write .okf-profile"; exit 1; }
          empty=$(cd "$wiki" && "$GITHUB_WORKSPACE/scripts/okf-check.sh" knowledge 2>&1 || true)
          case "$empty" in
            *"FAIL  no concept"*) echo "ok — the gate fails an empty wiki scaffold, for the right reason" ;;
            *) echo "::error::the gate did not fail an empty wiki scaffold on 'no concept': $empty"; exit 1 ;;
          esac
          cat > "$wiki/knowledge/reference/identity.md" <<'MD'
          ---
          type: Reference
          title: Identity
          description: Who owns this knowledge base.
          last_updated: 2026-09-29
          ---

          # Identity

          The owner.
          MD
          sed -i 's/^## Index$/## Index\n\n- [Identity](\/reference\/identity.md) — Who owns this knowledge base./' "$wiki/knowledge/reference/index.md"
          out=$(cd "$wiki" && "$GITHUB_WORKSPACE/scripts/okf-check.sh" knowledge)
          echo "$out"
          case "$out" in
            *"warn  "*) echo "::error::a populated wiki drew warnings (state or code_refs leaked into the wiki profile)"; exit 1 ;;
            *"ok    knowledge:"*) echo "ok — wiki gate green with no snapshot and no code_refs" ;;
            *) echo "::error::unexpected wiki gate output"; exit 1 ;;
          esac
          rec=$(cd "$wiki" && "$GITHUB_WORKSPACE/scripts/okf-recall.sh" "owner" knowledge)
          echo "$rec"
          case "$rec" in
            *"1 hit(s)"*"no status · no review date"*) echo "ok — wiki recall through the real okf" ;;
            *) echo "::error::wiki recall did not serve the concept"; exit 1 ;;
          esac
